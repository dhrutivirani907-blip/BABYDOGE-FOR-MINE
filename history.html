<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redeem History</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="page-header">

        <button class="back-btn" onclick="history.back()">

            <i class="fa-solid fa-arrow-left"></i>

        </button>

        <h2>Redeem History</h2>

    </div>

    <!-- History List -->

    <div id="historyList">

        <!-- Item 1 -->

        <div class="history-card">

            <div class="history-top">

                <h3>25 DOGE</h3>

                <span class="pending">Pending</span>

            </div>

            <p>Wallet</p>

            <small>D7axxxxxxxxxxxxxxxxxxxxx</small>

            <div class="history-bottom">

                <span>03 Aug 2026</span>

            </div>

        </div>

        <!-- Item 2 -->

        <div class="history-card">

            <div class="history-top">

                <h3>50 DOGE</h3>

                <span class="approved">Approved</span>

            </div>

            <p>Wallet</p>

            <small>D9bxxxxxxxxxxxxxxxxxxxxx</small>

            <div class="history-bottom">

                <span>01 Aug 2026</span>

            </div>

        </div>

        <!-- Item 3 -->

        <div class="history-card">

            <div class="history-top">

                <h3>100 DOGE</h3>

                <span class="rejected">Rejected</span>

            </div>

            <p>Wallet</p>

            <small>DA3xxxxxxxxxxxxxxxxxxxxx</small>

            <div class="history-bottom">

                <span>28 Jul 2026</span>

            </div>

        </div>

    </div>

</div>

<script src="js/history.js"></script>
<script src="js/banner.js"></script>
<script src="js/global-miner.js"></script>

</body>

</html>
