<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Complete Telegram Task</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="container">

        <div class="header">

            <div class="header-top">

                <h1>Telegram Task</h1>

                <button class="menu-btn"
                        onclick="goTasks()">

                    <i class="fa-solid fa-arrow-left"></i>

                </button>

            </div>

            <p>Complete the task to claim your reward</p>

        </div>


        <div class="card">

            <div class="icon">

                <i class="fa-brands fa-telegram"></i>

            </div>

            <div class="content">

                <h2>Complete Telegram Task</h2>

                <p>Reward: 5,000,000 BABYDOGE</p>

            </div>

        </div>


        <div class="card"
             onclick="startTask()">

            <div class="icon">

                <i class="fa-solid fa-play"></i>

            </div>

            <div class="content">

                <h2>Open Telegram Task</h2>

                <p>Tap here to start</p>

            </div>

            <div class="arrow">

                <i class="fa-solid fa-chevron-right"></i>

            </div>

        </div>


        <div class="card">

            <div class="content">

                <h3>Notice</h3>

                <p>
                    Open the Telegram task using the button above,
                    complete the required task, and then return to
                    RewardRush.
                </p>

            </div>

        </div>


        <div id="timerBox"
             class="card"
             style="display:none;">

            <div class="content">

                <h2>Task Timer</h2>

                <p id="timer">03:00</p>

                <button id="claimBtn"
                        style="display:none;"
                        onclick="claimReward()">

                    Claim 5,000,000 BABYDOGE

                </button>

            </div>

        </div>

    </div>


    <script>

        let timerSeconds = 180;

        let timerStarted = false;


        function goTasks() {

            window.location.href = "tasks.html";

        }


        function startTask() {

            if (timerStarted) {

                return;

            }

            timerStarted = true;

            window.open(
                "https://telegram.me/JacksFarm_bot?start=579941",
                "_blank"
            );

            document.getElementById("timerBox").style.display = "block";

            const timerElement =
                document.getElementById("timer");


            const interval = setInterval(() => {

                timerSeconds--;

                const minutes =
                    Math.floor(timerSeconds / 60);

                const seconds =
                    timerSeconds % 60;

                timerElement.innerText =
                    String(minutes).padStart(2, "0") +
                    ":" +
                    String(seconds).padStart(2, "0");


                if (timerSeconds <= 0) {

                    clearInterval(interval);

                    timerElement.innerText = "Task Time Completed";

                    document.getElementById("claimBtn").style.display = "block";

                }

            }, 1000);

        }


        async function claimReward() {

    const userId = localStorage.getItem("userId");

    if (!userId) {

        alert("User not found. Please restart the app.");

        return;

    }

    try {

        const response = await fetch(
            "https://weekly-contest-719v.onrender.com/api/reward/task-claim",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    userId: userId,
                    taskId: 1
                })
            }
        );

        const data = await response.json();

        if (data.success) {

            localStorage.setItem(
                "totalBalance",
                data.balance
            );

            alert(
                "✅ Reward Claimed!\n\n" +
                "+5,000,000 BABYDOGE\n\n" +
                "Total Balance: " +
                Number(data.balance).toLocaleString() +
                " BABYDOGE"
            );

            window.location.href = "index.html";

        } else {

            alert("❌ " + data.message);

        }

    } catch (error) {

        console.log("Claim Error:", error);

        alert(
            "Unable to claim reward. Please try again."
        );

    }

}

    </script>

</body>

</html>
