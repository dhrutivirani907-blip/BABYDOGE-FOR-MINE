<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <!-- 1. Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- 2. OnClickA TMA Ad SDK (Sahi location par add kar diya gaya hai) -->
    <script src="https://js.onclckvd.com/in-stream-ad-admanager/tma.js"></script>

    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow-x: hidden; overflow-y: auto; font-family: sans-serif; background-color: #f4f6f9; }
        .container { padding: 15px; width: 100%; min-height: 100vh; }
        .main-card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .clickable { cursor: pointer; }
        .balance-box { background: #f8f9fa; text-align: center; display: block; }
        .balance-amount { font-size: 24px; font-weight: bold; color: #28a745; margin-top: 5px; }
    </style>

    <meta name="bitmedia-site-verification" content="d5f423fd0b8b6dd57f05db80cdcaf825" />
</head>
<body>

<div class="container">
    <h2 style="text-align: center; margin-bottom: 20px;">Dashboard</h2>

    <!-- Box 1: Watch Ads & Mine -->
    <div class="main-card clickable" id="watchAdsCard">
        <div>
            <h3><i class="fa-solid fa-microchip" style="color: #007bff;"></i> Watch Ads & Mine</h3>
            <p style="margin: 5px 0 0 0; color: #666;">Unlock miners by watching ads</p>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
    </div>

    <!-- Box 2: Total Balance -->
    <div class="main-card balance-box">
        <h3 style="margin: 0; color: #555;">Total Balance</h3>
        <div class="balance-amount" id="userBalance">0 BABYDOGE</div>
    </div>

    <!-- Box 3: Redeem -->
    <div class="main-card clickable" id="redeemCard">
        <div>
            <h3><i class="fa-solid fa-wallet" style="color: #ff9900;"></i> Redeem</h3>
            <p style="margin: 5px 0 0 0; color: #666;">Withdraw your earnings</p>
        </div>
        <i class="fa-solid fa-chevron-right"></i>
    </div>
</div>

<script>
    function loadUserBalance() {
        const savedBalance = Number(localStorage.getItem("totalBalance")) || 0;
        const balanceElement = document.getElementById("userBalance");
        if (balanceElement) {
            balanceElement.innerText = Math.floor(savedBalance).toLocaleString() + " BABYDOGE";
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        } catch(e) {}
        
        loadUserBalance();

        document.getElementById("watchAdsCard").onclick = function() {
            const initData = window.Telegram?.WebApp?.initData || "";
            if (initData) {
                window.location.href = `captcha.html?${initData}#tgWebAppData=${encodeURIComponent(initData)}`;
            } else {
                window.location.href = "captcha.html";
            }
        };

        document.getElementById("redeemCard").onclick = function() {
            window.location.href = "redeem.html";
        };
    });

    window.addEventListener("pageshow", loadUserBalance);
</script>

<script src="js/global-miner.js"></script>

</body>
</html>
