<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AD MINING POWER</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- 1. OnClickA TMA Ad SDK -->
    <script src="https://js.onclckvd.com/in-stream-ad-admanager/tma.js"></script>

    <!-- 2. Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * { box-sizing: border-box; touch-action: manipulation; font-family: sans-serif; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow-x: hidden; overflow-y: auto; background-color: #f4f6f9; }
        
        .container { padding: 15px; width: 100%; min-height: 100vh; text-align: center; }
        
        /* Page Header */
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #333; }
        
        /* Coin Logo */
        .coin-logo { 
            width: 80px; 
            height: 80px; 
            margin: 10px auto 20px auto; 
            border-radius: 50%; 
            background: #ffb703; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
        }
        .coin-logo i { font-size: 45px; color: #ffffff; }

        /* Summary Boxes */
        .summary-box { 
            background: #ffffff; 
            border: 1px solid #e0e0e0; 
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 15px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        .summary-box h4 { margin: 0 0 5px 0; color: #666; font-size: 13px; text-transform: uppercase; }
        .summary-box .value { font-size: 22px; font-weight: bold; color: #28a745; }

        /* Mining Power Box */
        .miner-box { 
            background: #ffffff; 
            border: 2px solid #007bff; 
            border-radius: 14px; 
            padding: 20px; 
            margin: 15px 0; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
        }
        .miner-title { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 8px; }
        .progress-text { font-size: 16px; font-weight: bold; color: #007bff; margin: 10px 0; }
        
        .ad-btn { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            width: 100%; 
            transition: 0.2s ease;
        }
        .ad-btn:disabled { background: #6c757d; cursor: not-allowed; }

        /* Notice Card */
        .notice-card { 
            background: #fff3cd; 
            color: #856404; 
            border: 1px solid #ffeeba; 
            border-radius: 10px; 
            padding: 14px; 
            font-size: 13px; 
            font-weight: bold; 
            line-height: 1.5; 
            margin-top: 20px; 
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="page-header">
        <button class="back-btn" onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h3 style="margin:0;">AD MINING POWER</h3>
        <div style="width:20px;"></div>
    </div>

    <!-- Coin Logo -->
    <div class="coin-logo">
        <i class="fa-solid fa-coins"></i>
    </div>

    <!-- Total Mined Amount Box -->
    <div class="summary-box">
        <h4>TOTAL MINED BALANCE</h4>
        <div class="value" id="minedDisplay">0 BABYDOGE</div>
    </div>

    <!-- Total Active Miners Box -->
    <div class="summary-box">
        <h4>TOTAL ACTIVE MINERS</h4>
        <div class="value" style="color:#007bff;" id="activeMinersDisplay">0 Active</div>
    </div>

    <!-- Mining Power Action Box -->
    <div class="miner-box">
        <div class="miner-title">
            <i class="fa-solid fa-bolt" style="color:#ff9900;"></i> 100TH MINING POWER
        </div>
        <p style="margin: 5px 0; color: #555; font-size: 13px;">
            Watch 15 Ads to activate 1 Miner (+500 BABYDOGE/sec)
        </p>
        <div class="progress-text" id="adCounterText">Progress: 0 / 15 Ads</div>
        <button class="ad-btn" id="watchAdBtn" type="button">WATCH AD</button>
    </div>

    <!-- Highlighted Notice -->
    <div class="notice-card">
        <i class="fa-solid fa-triangle-exclamation"></i> <strong>NOTICE:</strong> 1 miner is active for 1 hour. After 1 hour, miner will be removed.
    </div>

</div>

<!-- Inline Logic Engine (Guarantees execution without 404 error) -->
<script>
    const SPOT_ID = '6151066';
    const ADS_PER_MINER = 15; 
    const MINING_RATE_PER_SEC = 500;
    const MINER_DURATION_MS = 60 * 60 * 1000;

    let totalBalance = Number(localStorage.getItem("totalBalance")) || 0;
    let adsWatched = Number(localStorage.getItem("adsWatchedCount")) || 0;
    let activeMiners = JSON.parse(localStorage.getItem("activeMinersList")) || [];

    function initOnClickA() {
        if (window.initCdTma) {
            window.initCdTma({ id: SPOT_ID })
                .then(show => {
                    window.show = show;
                    console.log("OnClickA Ad SDK Initialized!");
                })
                .catch(e => console.error('OnClickA Ad Init Error:', e));
        } else {
            setTimeout(initOnClickA, 500);
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        } catch (e) {
            console.error("Telegram WebApp Error:", e);
        }

        initOnClickA();
        updateUI();

        const watchBtn = document.getElementById("watchAdBtn");
        if (watchBtn) {
            watchBtn.addEventListener("click", handleAdClick);
        }
    });

    setInterval(() => {
        const now = Date.now();
        const validMiners = activeMiners.filter(expiryTime => expiryTime > now);
        
        if (validMiners.length !== activeMiners.length) {
            activeMiners = validMiners;
            localStorage.setItem("activeMinersList", JSON.stringify(activeMiners));
        }

        if (activeMiners.length > 0) {
            totalBalance += activeMiners.length * MINING_RATE_PER_SEC;
            localStorage.setItem("totalBalance", totalBalance);
        }

        updateUI();
    }, 1000);

    function updateUI() {
        const minedDisplay = document.getElementById("minedDisplay");
        const activeMinersDisplay = document.getElementById("activeMinersDisplay");
        const adCounterText = document.getElementById("adCounterText");

        if (minedDisplay) minedDisplay.innerText = Math.floor(totalBalance).toLocaleString() + " BABYDOGE";
        if (activeMinersDisplay) activeMinersDisplay.innerText = activeMiners.length + " Active";
        if (adCounterText) adCounterText.innerText = `Progress: ${adsWatched} / ${ADS_PER_MINER} Ads`;
    }

    function handleAdClick(e) {
        if (e && e.preventDefault) e.preventDefault();

        const btn = document.getElementById("watchAdBtn");
        if (btn && btn.disabled) return;

        if (btn) {
            btn.disabled = true;
            btn.innerText = "⏳ Requesting Ad...";
        }

        if (typeof window.show === 'function') {
            window.show()
                .then(() => processAdCompletion())
                .catch((err) => {
                    const msg = typeof err === 'object' ? JSON.stringify(err) : err;
                    alert("⚠️ Ad Error: " + (msg || "No fill ya user ne close kar diya."));
                })
                .finally(() => resetButtonState());
        } else if (window.initCdTma) {
            window.initCdTma({ id: SPOT_ID })
                .then(show => {
                    window.show = show;
                    return window.show();
                })
                .then(() => processAdCompletion())
                .catch((err) => {
                    const msg = typeof err === 'object' ? JSON.stringify(err) : err;
                    alert("⚠️ SDK Init Error: " + (msg || "Ad Server connect nahi ho paya."));
                })
                .finally(() => resetButtonState());
        } else {
            alert("⚠️ OnClickA tma.js SDK script load nahi hui hai.");
            resetButtonState();
        }
    }

    async function processAdCompletion() {
        adsWatched += 1;

        if (adsWatched >= ADS_PER_MINER) {
            adsWatched = 0;
            const expiryTime = Date.now() + MINER_DURATION_MS;
            activeMiners.push(expiryTime);
            localStorage.setItem("activeMinersList", JSON.stringify(activeMiners));

            alert(`🎉 Congratulations!\n\nAapne 15 Ads poore kar liye hain! 1 Naya Miner 1 ghante ke liye activate ho gaya hai (+500 BABYDOGE/sec).`);
        } else {
            alert(`✅ Ad Verified!\n\nProgress: ${adsWatched} / ${ADS_PER_MINER} Ads completed.`);
        }

        localStorage.setItem("adsWatchedCount", adsWatched);
        updateUI();
    }

    function resetButtonState() {
        const btn = document.getElementById("watchAdBtn");
        if (btn) {
            btn.disabled = false;
            btn.innerText = "WATCH AD";
        }
    }
</script>

</body>
</html>
